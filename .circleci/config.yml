version: 2.1
workflows:
  main:
    jobs:
      - build
jobs:
  build:
    # resource_class: xlarge
    machine:
      image: ubuntu-2004:202101-01
    environment:
      OS: ubuntu
      OS_VER: 20.04
      GITHUB_REPO: pmem/rpma
      GH_CR_ADDR:  ghcr.io
      DOCKER_REPO: ghcr.io/pmem/rpma
      TYPE: circleci
      HOST_WORKDIR: /home/circleci/project
      WORKDIR: utils/docker
    steps:
      - checkout
      - run:
          name: Update OS and install the 'linux-modules-extra' package
          command: .circleci/install-kernel-modules.sh
      - run:
          # Configure SoftRoCE and read the RPMA_SOFT_ROCE_IP environment variable
          name: Configure SoftRoCE
          command: tools/config_softroce.sh && source $BASH_ENV && echo $BASH_ENV && echo RPMA_SOFT_ROCE_IP=$RPMA_SOFT_ROCE_IP
      - run:
          name: Pull or rebuild the Docker image
          command: cd $WORKDIR && ./pull-or-rebuild-image.sh
      - run:
          name: Run the build of librpma
          command: cd $WORKDIR && ./build.sh
