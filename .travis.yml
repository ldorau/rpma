dist: trusty

sudo: required

language: c

services:
  - docker

env:
  global:
    - GITHUB_REPO=pmem/rpma
    - DOCKER_REPO=ghcr.io/pmem/rpma
    - GH_CR_ADDR=ghcr.io
  matrix:
    - OS=ubuntu OS_VER=21.10 TYPE=normal CC=gcc
    - OS=ubuntu OS_VER=21.10 TYPE=normal CC=clang
    - OS=fedora OS_VER=32    TYPE=normal CC=gcc
    - OS=fedora OS_VER=32    TYPE=normal CC=clang
    - OS=centos OS_VER=stream TYPE=normal CC=gcc REBUILD_ALWAYS=YES

before_install:
  - echo $TRAVIS_COMMIT_RANGE
  - export HOST_WORKDIR=`pwd`
  - cd utils/docker
  - ./pull-or-rebuild-image.sh

script:
  - ./build.sh
